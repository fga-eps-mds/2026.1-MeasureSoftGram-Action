# sonar.projectKey definido dinamicamente no CI
sonar.organization=fga-eps-mds-1
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=__tests__
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage.xml

sonar.exclusions=dist/**,assets/**,coverage/**
sonar.coverage.exclusions=__tests__/**,parser.py
